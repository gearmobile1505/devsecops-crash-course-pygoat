name: CI

on: [push]

jobs:
  sast_scan:
    name: Run Bandit Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.8

    - name: Install Bandit
      run: pip install bandit

    - name: Run Bandit Scan
      run: bandit -ll -ii -r . -f json -o bandit-report.json

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
       name: bandit-findings
       path: bandit-report.json

  image_scan:
    name: Build Image and Run Image Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.REPO_USER }}
        password: ${{ secrets.REPO_PWD }}

    - name: Build Docker Image
      run: |
        docker build -f Dockerfile -t ${{ secrets.REPO_USER }}/pygoat:latest .
        docker tag ${{ secrets.REPO_USER }}/pygoat:latest ${{ secrets.REPO_USER }}/pygoat:${{ github.sha }}

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.REPO_USER }}/pygoat:latest
        docker push ${{ secrets.REPO_USER }}/pygoat:${{ github.sha }}

    - name: Save Docker Image to tar
      run: docker save -o pygoat.tar ${{ secrets.REPO_USER }}/pygoat:${{ github.sha }}

    - name: Docker Scout Scan
      uses: docker/scout-action@v1.0.9
      with:
        dockerhub-user: ${{ secrets.REPO_USER }}
        dockerhub-password: ${{ secrets.REPO_PWD }}
        command: quickview,cves
        only-severities: critical,high
        image: pygoat.tar
        sarif-file: scout-report.sarif

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: docker-scout-findings
        path: scout-report.sarif
